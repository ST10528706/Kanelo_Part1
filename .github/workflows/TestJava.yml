name: TestJava
on: 
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          
      - name: Download JUnit
        run: |
          mkdir -p junit-libs
          curl -fSL -o junit-libs/junit-4.13.2.jar https://repo1.maven.org/maven2/junit/junit/4.13.2.jar
          curl -fSL -o junit-libs/hamcrest-core-1.3.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar
      - name: Run unit tests with Ant
        run: ant -noinput -buildfile build.xml -Djavac.test.classpath="build/classes:junit-libs/junit-4.13.2.jar:junit-libs/hamcrest-core-1.3.jar" test 
