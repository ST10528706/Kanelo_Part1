name: TestJava
on: 
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          
      - name: Install JUnit
        run: |
          sudo apt-get update
          sudo apt-get install -y junit4 libhamcrest-java
          
      - name: Run unit tests with Ant
        run: ant -noinput -buildfile build.xml -Djavac.test.classpath="build/classes:/usr/share/java/junit4.jar:/usr/share/java/hamcrest-core.jar" test
